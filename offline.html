<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <meta name="theme-color" content="#1E3A8A">
  <title>Absenku — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F1F5F9; color: #0F172A;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 32px 24px; max-width: 380px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.05); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #64748B; line-height: 1.6; margin: 0 0 20px; font-size: 14px; }
    a { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="Absenku">
    <h1>Tidak ada koneksi internet</h1>
    <p>Absenku membutuhkan internet untuk absen dan memuat data. Periksa data seluler atau Wi-Fi Anda, lalu coba lagi.</p>
    <a href="./">Coba lagi</a>
  </div>
</body>
</html>
